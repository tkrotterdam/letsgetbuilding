  }

  function auditPayload(c, cs) {
    var d = D(c), r = riskOf(d), sig = signalRows(c, d), done = cs.done, sw = c.sow ? sowStats(c) : null;
    return {
      environment: "fictional_demo", syntheticDataOnly: true, bank: "Seeblick Privatbank (fictional)", policyVersion: POLICY_VERSION + " (fictional)",
      caseId: c.id, applicant: c.name, clientLanguage: c.lang,
      agentRecommendation: done ? d.reco : null,
      riskRating: done ? { level: r.level, score: r.score, factors: d.risk.map(function (f, i) { return { factor: FACTORS[i], points: f[0], reason: f[1] }; }) } : null,
      checks: STEPS.filter(function (s) { return cs.st[s.id] === "done"; }).map(function (s) {
        var nt = stepNote(c, d, s);
        return { id: s.id, agent: laneOf(s).name, tool: s.tool, confidence: s.conf / 100, result: nt[0] };
      }),
      screening: done ? { sanctions: d.screen.sanc, pep: d.screen.pep, adverseMedia: d.screen.media } : null,
      documentAuthenticity: done ? { passport: sig.pp.map(function (x) { return { signal: x[0], result: x[1], detail: x[2] }; }), proofOfAddress: sig.bill.map(function (x) { return { signal: x[0], result: x[1], detail: x[2] }; }) } : null,
      sourceOfWealth: sw && done ? { declaredChfMillion: sw.tot, evidencedChfMillion: sw.ev, coveragePercent: sw.cov, thresholdPercent: c.sow.threshold,
        sources: c.sow.rows.map(function (x) { return { source: x[0], declared: x[1], evidenced: x[2], evidence: x[3] }; }) } : null,
      flags: done ? d.flags.map(function (f) { return { title: f.t, severity: f.s, policy: f.p, reasoning: f.r, evidenceFields: f.ev }; }) : [],
      resolvedFlags: done ? (d.resolved || []).map(function (f) { return { title: f.t, resolution: f.r }; }) : [],
      clientMessage: cs.out ? { language: c.next.lang, status: cs.out === "draft" ? "drafted" : cs.out === "sent" ? "sent" : "replied", sentAt: cs.sentAt || null } : null,
      events: cs.log,
      humanDecision: cs.decision ? { decision: cs.decision, decidedBy: cs.by, comment: cs.comment, overrodeAgent: cs.override } : null
    };
  }

  function renderAudit(c, cs) {
    var items = cs.log.length ? cs.log.map(function (e) {
      return "<li><time>" + e.time + '</time><div><span class="kind ' + e.kind + '">' + { agent: "Agent", flag: "Flag", human: "Officer", sys: "System" }[e.kind] + "</span>" + esc(e.text) + "</div></li>";
    }).join("") : '<li><time>—</time><div style="color:var(--muted)">No activity yet. Run the agent to start the record.</div></li>';
    return '<div class="audit"><div class="audit-top"><div><h3>Activity record</h3><p>Every agent step, flag and human decision, timestamped.</p></div>' +
      '<button class="btn" type="button" data-json>Show audit log (JSON)</button></div>' +
      '<ol class="events">' + items + "</ol>" +
      (cs.json ? '<div class="json-out"><button class="btn" type="button" data-copy>Copy JSON</button><span class="copied" data-copied hidden>Copied</span><textarea id="json-' + c.id + '" readonly>' + esc(cs.json) + "</textarea></div>" : "") +
      "</div>";
  }

  // Marks the fields the agent is reading, the issues it has found, and whatever evidence the officer is pointing at.
  function paintHighlights(c, cs) {
    var d = D(c), lit = {}, scan = { pp: false, bill: false }, focus = {};
    STEPS.forEach(function (s) {
      if (cs.st[s.id] === "run") {
        s.lit.forEach(function (f) { lit[f] = s.conf; });
        if (s.scan === "pp" || s.scan === "both") scan.pp = true;
        if (s.scan === "bill" || s.scan === "both") scan.bill = true;
      }
    });
    (cs.hover.length ? cs.hover : cs.pin).forEach(function (f) { focus[f] = true; });
    app.querySelectorAll("[data-f]").forEach(function (el) {
      var f = el.getAttribute("data-f"), iss = d.issues[f], show = iss && cs.st[iss[1]] === "done" && !(cs.running && cs.rerun);
      el.classList.remove("lit", "issue", "partial", "tamper", "focus");
      el.removeAttribute("data-conf");
      if (lit[f]) { el.classList.add("lit"); el.setAttribute("data-conf", lit[f] + "%"); }
      else if (show) { el.classList.add(iss[0] === "tamper" ? "issue" : iss[0]); if (iss[0] === "tamper") el.classList.add("tamper"); }
      if (focus[f]) el.classList.add("focus");
    });
    var a = $("#doc-pp"), b = $("#doc-bill");
    if (a) a.classList.toggle("scanning", scan.pp);
    if (b) b.classList.toggle("scanning", scan.bill);
  }
  // Bars and meters grow to their value the first time results appear. After that they render at full width, so toggling a panel never replays the animation.
  function wAttr(cs, pct) { return ' data-w="' + pct + '"' + (cs.seen ? ' style="width:' + pct + '%"' : ""); }
  function animateBars(cs) {
    var els = app.querySelectorAll("[data-w]:not([style])");
    if (cs.done && !cs.running) cs.seen = true;
    requestAnimationFrame(function () { requestAnimationFrame(function () { els.forEach(function (el) { el.style.width = el.getAttribute("data-w") + "%"; }); }); });
  }

  // Timer-driven refresh for the open case. The documents are left alone so the scan line keeps sweeping.
  function updateCase(c) {
    var cs = state.cases[c.id], d = D(c), btn = $("[data-run]"), crew = $("#crew"), res = $("#results");
    if (btn) { btn.disabled = cs.running; btn.textContent = runLabel(cs); }
    if (crew) crew.innerHTML = renderCrew(c, cs, d);
    paintHighlights(c, cs);
    if (res && res.getAttribute("data-sig") !== resSig(cs)) {
      res.innerHTML = renderSide(c, cs, d);
      res.setAttribute("data-sig", resSig(cs));
      animateBars(cs);
    }
  }
  function touch(c) {
    if (state.view === "queue") updateQueue();
    else if (state.view === c.id) updateCase(c);
  }
  function refreshAll(c) {
    if (state.view === "queue") renderQueue();
    else if (state.view === c.id) renderCase(c);
  }

  // ---------- Agent run ----------
  function startTicker() { if (!ticker) ticker = setInterval(tick, 100); }
  function tick() {
    var any = CASES.some(function (c) { return state.cases[c.id].running; }), el = $("[data-clock]");
    if (el) {
      if (state.view === "queue") { if (state.batch && !state.batch.end) el.textContent = secs(Date.now() - state.batch.start); }
      else { var cs = state.cases[state.view]; if (cs.running) el.textContent = secs(Date.now() - cs.t0); }
    }
    if (!any) { clearInterval(ticker); ticker = null; }
  }

  // `only` lists the steps to repeat after a client reply; without it the whole crew runs.
  function runAgent(c, only, delay) {
    var cs = state.cases[c.id], lag = delay || 0, k = only ? 0.8 : 1, list, base, left, sched = {}, tmax = 0;
    cs.timers.forEach(clearTimeout);
    if (!only) cs = state.cases[c.id] = freshCase();
    cs.timers = [];
    list = STEPS.filter(function (s) { return !only || only.indexOf(s.id) !== -1; });
    base = only ? Math.min.apply(null, list.map(function (s) { return s.at; })) : 0;
    left = list.length;
    list.forEach(function (s) {
      var a = (s.at - base) * k + (only ? 300 : 0), b = a + s.dur * k;
      sched[s.id] = [a, b];
      if (b > tmax) tmax = b;
    });
    cs.sched = { total: tmax, steps: sched };
    cs.running = true; cs.done = false; cs.rerun = !!only; cs.crew = "open"; cs.feed = []; cs.started = {};
    cs.t0 = Date.now() + lag; cs.elapsed = 0;
    list.forEach(function (s) { cs.st[s.id] = "wait"; });
    addLog(cs, "sys", only ? "Re-verification started on " + plural(list.length, "check", "checks") : "Case " + c.id + " opened; agent crew started under policy " + POLICY_VERSION);
    if (lag) later(cs, function () { touch(c); }, lag);
    list.forEach(function (s) {
      later(cs, function () { cs.st[s.id] = "run"; cs.feed.push(s.id); cs.started[s.id] = Date.now() - cs.t0; touch(c); }, lag + sched[s.id][0]);
      later(cs, function () {
        var nt = stepNote(c, D(c), s);
        cs.st[s.id] = "done";
        addLog(cs, "agent", "[" + laneOf(s).name + "] " + s.label + " · " + nt[0] + " · " + s.tool + " · " + s.conf + "% confidence");
        left -= 1;
        if (left === 0) finish(c, !!only); else touch(c);
      }, lag + sched[s.id][1]);
    });
    startTicker();
  }

  function setDraft(cs, d) {
    var old = cs.draft;
    cs.draft = d.rationale;
    if (!cs.comment || cs.comment === old) cs.comment = cs.draft;
  }

  function finish(c, isRerun) {
    var cs = state.cases[c.id], d = D(c), r = riskOf(d);
    cs.running = false; cs.done = true; cs.rerun = false; cs.elapsed = Date.now() - cs.t0; cs.crew = "min";
    if (isRerun) {
      (d.resolved || []).forEach(function (f) { addLog(cs, "agent", "Flag resolved: " + f.t + ". " + f.r); });
      addLog(cs, "agent", "Recommendation updated: " + c.reco + " to " + d.reco + ". Risk rating " + r.level + " (" + r.score + "). Awaiting officer decision.");
    } else {
      d.flags.forEach(function (f) { addLog(cs, "flag", f.t + " (" + f.s + ", policy " + f.p + ")"); });
      addLog(cs, "agent", "Recommendation: " + d.reco + ". Risk rating " + r.level + " (" + r.score + "). Awaiting officer decision.");
      if (c.next.type === "outreach") { cs.out = "draft"; cs.msg = c.next.body; addLog(cs, "agent", "Drafted a client message in " + c.next.lang + " for the officer to review (policy §7.2)"); }
      if (c.next.type === "hold") addLog(cs, "agent", "Held back from contacting the client (policy §4.3). Escalation pack prepared.");
    }
    setDraft(cs, d);
    document.getElementById("live-status").textContent = c.name + ": analysis complete, recommendation " + d.reco;
    maybeStp(c);
    refreshAll(c);
    checkBatchDone();
  }

  function maybeStp(c) {
    var cs = state.cases[c.id], d = D(c);
    if (!state.stp || cs.decision || !cs.done || cs.running || !stpEligible(d)) return;
    cs.decision = "Approved"; cs.by = "agent"; cs.override = false;
    cs.comment = cs.comment || d.rationale;
    addLog(cs, "agent", "Straight-through approval under policy §6.1: Low risk, no open flags, no sanctions candidates, every check at 95% confidence or better. Post-decision QA sampling applies.");
  }

  function runAll() {
    var idle = CASES.filter(function (cc) { var s = state.cases[cc.id]; return !s.running && !s.done; });
    if (!idle.length) return;
    state.batch = { start: Date.now(), end: null, ids: idle.map(function (cc) { return cc.id; }) };
    idle.forEach(function (cc, i) { runAgent(cc, null, i * 260); });
    renderQueue();
  }
  function checkBatchDone() {
    var b = state.batch;
    if (!b || b.end) return;
    if (b.ids.every(function (id) { return state.cases[id].done; })) {
      b.end = Date.now();
      if (state.view === "queue") renderQueue();
    }
  }

  // ---------- Client outreach ----------
  function sendOutreach(c) {
    var cs = state.cases[c.id];
    cs.out = "sent"; cs.sentAt = now();
    addLog(cs, "human", "Officer reviewed and sent the " + c.next.lang + " client request via the client portal (policy §7.2)");
    render();
  }
  function simulateReply(c) {
    var cs = state.cases[c.id];
    cs.out = "replied"; cs.replied = true; cs.replyAt = now(); cs.tab = "results"; cs.seen = false;
    addLog(cs, "sys", "Client reply received via the portal (simulated). " + c.next.read);
    runAgent(c, c.next.rerun, 0);
    render();
  }

  // ---------- Dialog ----------
  function fmtN(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "’"); }
  function renderDialog() {
    var tabs = [["crew", "The crew"], ["controls", "Guardrails"], ["biz", "Business case"]];
    var body;
    if (dlgTab === "crew") {
      var cards = [
        ["O", "Orchestrator", "Plans each case, hands checks to the four agents, assembles the recommendation, drafts client messages in the client’s language, and stops to ask when policy says so.", "plan() · delegate() · client.draft() · escalate()"],
        ["D", "Document agent", "Reads passports and proofs of address, validates the MRZ check digits, and looks for edits: PDF revisions, fonts, compression, issuer templates.", "ocr.extract · mrz.validate · forensics.analyse"],
        ["I", "Identity agent", "Matches names, dates of birth and addresses across the passport, the bill and the application, and tolerates spelling variants.", "match.name · match.dob · match.address"],
        ["S", "Screening agent", "Screens sanctions, PEP lists and relatives, and adverse media. Dismisses look-alike hits only when two independent identifiers disagree, and writes down why.", "screen.sanctions · screen.pep · media.search"],
        ["R", "Policy & risk agent", "Applies your policy as written, rates customer risk from six visible factors, and drafts the rationale an officer signs.", "policy.check · risk.score · case.recommend"]
      ];
      body = '<h2 id="dlg-title">How the agent crew works</h2><p>One orchestrator plans each case. Four specialist agents run their checks in parallel, call tools, and write every step to the audit trail.</p><div class="cards">' +
        cards.map(function (x, i) { return '<div class="card' + (i === 0 ? " wide" : "") + '"><div class="ch"><span class="glyph" aria-hidden="true">' + x[0] + "</span><b>" + esc(x[1]) + "</b></div><p>" + esc(x[2]) + "</p><code>" + esc(x[3]) + "</code></div>"; }).join("") + "</div>" +
        '<p class="dlg-foot">This demo is scripted. Every document, name and watchlist entry is synthetic, and the timings are staged. A production deployment calls real models and your screening provider under your own model-risk governance.</p>';
    } else if (dlgTab === "controls") {
      var rows = [
        ["Read documents and extract fields", "Does it", "Reviews flags", "Not involved"],
        ["Dismiss a look-alike screening hit", "Does it, with a written reason (§5.1)", "Can overrule", "Samples for audit"],
        ["Message the client", "Drafts it", "Reviews and sends (§7.2)", "Not involved"],
        ["Contact a client whose identity is in doubt", "Never. Holds back (§4.3)", "Never", "Decides"],
        ["Approve a Low-risk, clean case", "Recommends, or approves straight-through if switched on (§6.1)", "Decides", "Samples for QA"],
        ["Approve a Medium-risk case", "Recommends", "Decides", "Not involved"],
        ["Approve a High-risk or PEP case", "Prepares the pack", "Escalates", "Decides, with senior management (§5.3)"],
        ["Change policy or thresholds", "Never", "Never", "Owns it, versioned"]
      ];
      body = '<h2 id="dlg-title">What the agent may and may not do</h2><p>The agent works inside the limits your policy sets. Raising or lowering them is a policy change, not a prompt change.</p>' +
        '<div class="matrix-wrap"><table class="matrix"><thead><tr><th>Action</th><th>Agent</th><th>Officer</th><th>Compliance</th></tr></thead><tbody>' +
        rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + esc(x) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>" +
        '<div class="cards"><div class="card"><b>Every step is on the record</b><p>Each tool call, flag, override and decision is timestamped in the audit trail, and policy version ' + POLICY_VERSION + ' is stamped on every case.</p></div>' +
        '<div class="card"><b>The agent stops when it should</b><p>Low confidence, a possible forgery, a PEP link or a High risk rating all route to a person. An officer can overrule the agent, and the override is logged.</p></div></div>';
    } else {
      body = '<h2 id="dlg-title">What it could save</h2><p>Illustrative. Move the sliders to your own volumes and times. The agent is assumed to leave an officer 1.5 minutes on a clean case and 8 minutes on an exception.</p>' +
        '<div class="calc">' +
        '<div class="ctl"><label for="c-vol">Applications per month <output id="o-vol">250</output></label><input id="c-vol" type="range" min="20" max="2000" step="10" value="250"></div>' +
        '<div class="ctl"><label for="c-man">Manual review per case <output id="o-man">38 min</output></label><input id="c-man" type="range" min="10" max="90" step="1" value="38"></div>' +
        '<div class="ctl"><label for="c-share">Cases clean on first pass <output id="o-share">62%</output></label><input id="c-share" type="range" min="10" max="90" step="1" value="62"></div>' +
        '<div class="ctl"><label for="c-rate">Loaded cost per officer hour <output id="o-rate">CHF 90</output></label><input id="c-rate" type="range" min="40" max="200" step="5" value="90"></div></div>' +
        '<div class="outs" aria-live="polite"><div><div class="label">Officer time per case</div><div class="v" id="r-min">38 → 4.0 min</div></div><div><div class="label">Hours saved a month</div><div class="v" id="r-hrs">142</div></div>' +
        '<div><div class="label">Officers freed up</div><div class="v" id="r-fte">1.0 FTE</div><div class="s">at 140 productive hours a month</div></div><div><div class="label">Saved a year</div><div class="v" id="r-chf">CHF 153’000</div></div></div>' +
        '<p class="dlg-foot">Hours saved = applications × (manual minutes − assisted minutes) ÷ 60. Assisted minutes = clean share × 1.5 + exception share × 8. These are assumptions, not measurements from this demo.</p>';
    }
    dialog.innerHTML = '<div class="dlg-head"><div class="tabs" role="tablist">' + tabs.map(function (t) {
      return '<button class="tab" role="tab" type="button" data-dtab="' + t[0] + '" aria-selected="' + (dlgTab === t[0]) + '">' + t[1] + "</button>";
    }).join("") + '</div><button class="btn dlg-x" type="button" data-dclose>Close</button></div><div class="dlg-body">' + body + "</div>";
    if (dlgTab === "biz") calc();
  }
  function calc() {
    var v = +$("#c-vol").value, m = +$("#c-man").value, s = +$("#c-share").value / 100, rate = +$("#c-rate").value;
    var after = s * 1.5 + (1 - s) * 8, saved = v * (m - after) / 60;
    $("#o-vol").textContent = fmtN(v); $("#o-man").textContent = m + " min"; $("#o-share").textContent = Math.round(s * 100) + "%"; $("#o-rate").textContent = "CHF " + rate;
    $("#r-min").textContent = m + " → " + after.toFixed(1) + " min";
    $("#r-hrs").textContent = fmtN(Math.max(0, saved));
    $("#r-fte").textContent = (Math.max(0, saved) / 140).toFixed(1) + " FTE";
    $("#r-chf").textContent = "CHF " + fmtN(Math.max(0, saved) * 12 * rate);
  }
  function openDialog() { renderDialog(); if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", ""); }

  // ---------- Router ----------
  function render() {
    if (state.view === "queue") renderQueue();
    else renderCase(byId(state.view));
  }
  function reducedMotion() { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    var c = state.view !== "queue" ? byId(state.view) : null;
    var cs = c ? state.cases[c.id] : null;
    if (t.hasAttribute("data-open")) { state.view = t.getAttribute("data-open"); render(); window.scrollTo(0, 0); }
    else if (t.hasAttribute("data-back")) { state.view = "queue"; render(); }
    else if (t.hasAttribute("data-runall")) runAll();
    else if (t.hasAttribute("data-run")) { runAgent(c, null, 0); render(); }
    else if (t.hasAttribute("data-tab")) { cs.tab = t.getAttribute("data-tab"); render(); }
    else if (t.hasAttribute("data-audit")) { cs.tab = "audit"; render(); }
    else if (t.hasAttribute("data-crew-toggle")) { cs.crew = cs.crew === "min" ? "open" : "min"; render(); }
    else if (t.hasAttribute("data-forensic")) { cs.forensic = !cs.forensic; render(); }
    else if (t.hasAttribute("data-send")) sendOutreach(c);
    else if (t.hasAttribute("data-reply")) simulateReply(c);
    else if (t.hasAttribute("data-reopen")) {
      cs.decision = null; cs.by = null; addLog(cs, "human", "Officer reopened the case after a straight-through approval"); render();
    }
    else if (t.hasAttribute("data-show")) {
      var ids = t.getAttribute("data-show").split(",");
      cs.pin = cs.pin.join(",") === ids.join(",") ? [] : ids;
      render();
      var first = cs.pin.length ? app.querySelector('[data-f="' + cs.pin[0] + '"]') : null;
      if (first) first.scrollIntoView({ block: "nearest", behavior: reducedMotion() ? "auto" : "smooth" });
    }
    else if (t.hasAttribute("data-decide")) {
      if (!cs.comment.trim()) { cs.err = true; render(); var ta = document.getElementById("comment-" + c.id); if (ta) ta.focus(); return; }
      var d = D(c), choice = t.getAttribute("data-decide");
      if (choice === "Approved" && riskOf(d).level === "HIGH") return;
      cs.err = false; cs.decision = choice; cs.by = "officer";
      cs.override = (choice === "Approved" && d.reco !== "CLEAR") || (choice !== "Approved" && d.reco === "CLEAR");
      addLog(cs, "human", "Decision: " + choice + (cs.override ? " (overrides the agent's " + d.reco + " recommendation)" : "") + " · “" + cs.comment.trim() + "”");
      render();
    }
    else if (t.hasAttribute("data-json")) { cs.json = JSON.stringify(auditPayload(c, cs), null, 2); render(); }
    else if (t.hasAttribute("data-copy")) {
      var area = document.getElementById("json-" + c.id), flag = app.querySelector("[data-copied]");
      var done = function () { if (flag) flag.hidden = false; };
      var fallback = function () { if (area) { area.focus(); area.select(); } };
      try { navigator.clipboard.writeText(cs.json).then(done, fallback); } catch (err) { fallback(); }
    }
  });

  app.addEventListener("input", function (e) {
    if (state.view === "queue") return;
    var cs = state.cases[state.view];
    if (e.target.hasAttribute("data-comment")) {
      cs.comment = e.target.value;
      if (cs.err && cs.comment.trim()) { cs.err = false; e.target.classList.remove("err"); var m = app.querySelector(".err-msg"); if (m) m.remove(); }
    } else if (e.target.hasAttribute("data-msg")) cs.msg = e.target.value;
  });
  app.addEventListener("change", function (e) {
    if (e.target.hasAttribute("data-stp")) {
      state.stp = e.target.checked;
      if (state.stp) CASES.forEach(maybeStp);
      renderQueue();
      var sw = app.querySelector("[data-stp]"); if (sw) sw.focus();
    }
  });
  // Pointing at a flag, comparison row or screening hit lights up its evidence in the documents.
  app.addEventListener("mouseover", function (e) {
    if (state.view === "queue") return;
    var el = e.target.closest("[data-ev]"), cs = state.cases[state.view];
    if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;
    cs.hover = el.getAttribute("data-ev").split(",");
    paintHighlights(byId(state.view), cs);
  });
  app.addEventListener("mouseout", function (e) {
    if (state.view === "queue") return;
    var el = e.target.closest("[data-ev]"), cs = state.cases[state.view];
    if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;
    cs.hover = [];
    paintHighlights(byId(state.view), cs);
  });
  // `toggle` does not bubble, so listen in the capture phase to remember which sections the officer opened.
  app.addEventListener("toggle", function (e) {
    var el = e.target;
    if (state.view !== "queue" && el.getAttribute && el.getAttribute("data-sec")) state.cases[state.view].open[el.getAttribute("data-sec")] = el.open;
  }, true);

  dialog.addEventListener("click", function (e) {
    if (e.target === dialog || e.target.hasAttribute("data-dclose")) { dialog.close(); return; }
    var t = e.target.closest("[data-dtab]");
    if (t) { dlgTab = t.getAttribute("data-dtab"); renderDialog(); }
  });
  dialog.addEventListener("input", function (e) { if (e.target.type === "range") calc(); });

  try { window.matchMedia("(max-width: 760px)").addEventListener("change", function () { if (state.view !== "queue") render(); }); } catch (err) { /* older browsers keep the layout they loaded with */ }
  document.getElementById("home").addEventListener("click", function () { state.view = "queue"; render(); });
  document.getElementById("crew-open").addEventListener("click", openDialog);
  document.getElementById("reset").addEventListener("click", function () {
    CASES.forEach(function (c) { state.cases[c.id].timers.forEach(clearTimeout); });
    if (dialog.open) dialog.close();
    state = freshState(); render(); window.scrollTo(0, 0);
  });

  render();
})();
</script>
